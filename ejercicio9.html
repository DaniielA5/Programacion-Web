<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale-1.0">
        <title>Contacto | DevSolutions</title>
        <link rel="stylesheet" href="css/ejercicio9.css">
        <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap)" rel="stylesheet">
    </head>

    <body>
        <div class="contenedor-formulario">
            <h1>Contactanos</h1>
            <p class="subtitulo">Tienes dudas? Escribenos y te responderemos dentro de 24 hrs.</p>

            <form class="formulario">
                <!-- GRupo 1 datos historicos-->
                 <div class="grupo-formulario">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Ej: Ana perez" required>
                 </div>

                 <!-- Grupo 2 Email y telefono -->
                <div class="grupo-doble">
                    <div class="grupo-formulario">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="ana@ejemplo.com" required>
                        
                    </div>
                    <div class="grupo-formulario">
                        <label for="telefono">Telefono<span>(Opcional)</span></label>
                        <input type="tel" id="telefono" placeholder="+52 951 233 23 23">

                    </div>
                </div>

                <!--Grupo 3: Mensaje-->
                <div class="grupo-formulario">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" rows="5" placeholder="Describe tu consulta ..." required></textarea>
                </div>

                <!--Boton-->
                <button type="submit" class="boton-enviar">
                    Enviar mensaje <span>-></span>
                </button>
            </form>

        </div>
    </body>
</html>
